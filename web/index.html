<!DOCTYPE html>
<html lang="it">
  <head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apri gli occhi: c’è l’Isola davanti a te.">

    <style>
      @font-face {
        font-family: 'Arvo';
        src: url('assets/assets/google_fonts/Arvo-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: #010e22;
      }

      #landing-background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }

      #landing-background.is-loaded {
        opacity: 1;
      }

      #landing-loader {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #fff;
        pointer-events: none;
        transition: opacity 180ms ease-out;
      }

      #landing-loader.is-complete {
        opacity: 0;
      }

      #landing-loader-icon {
        width: 44px;
        height: 44px;
        filter: brightness(0) invert(1);
        animation: landing-loader-rotation 900ms linear infinite;
      }

      #landing-loader-progress {
        min-width: 4ch;
        font-family: 'Arvo', serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1;
        text-align: center;
        color: #fff;
        font-variant-numeric: tabular-nums;
      }

      @keyframes landing-loader-rotation {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #landing-loader-icon {
          animation-duration: 1800ms;
        }
      }
    </style>

    <script>
      (() => {
        const preferenceKey = 'flutter.public_landing_mobile_background';
        const desktopBackground = 'assets/assets/background.webp';
        const palombaroBackground =
          'assets/assets/background%2520palombaro.webp';
        const sirenaBackground =
          'assets/assets/background%2520sirena.webp';
        const isPhone = Math.min(window.innerWidth, window.innerHeight) < 600;
        let selectedBackground = desktopBackground;
        let selectedFlutterBackground = 'assets/background.webp';

        if (isPhone) {
          try {
            const previousBackground = JSON.parse(
              window.localStorage.getItem(preferenceKey),
            );
            selectedBackground =
              previousBackground === 'assets/background palombaro.webp'
                ? sirenaBackground
                : palombaroBackground;
            selectedFlutterBackground =
              selectedBackground === sirenaBackground
                ? 'assets/background sirena.webp'
                : 'assets/background palombaro.webp';
            window.localStorage.setItem(
              preferenceKey,
              JSON.stringify(selectedFlutterBackground),
            );
          } catch (_) {
            selectedBackground = palombaroBackground;
          }
        }

        window.honooLandingBackground = selectedBackground;

        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = selectedBackground;
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
      })();
    </script>

    <!-- Tema colore per Chrome, Android, ecc. -->
    <meta name="theme-color" content="#010e22">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon principale -->
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="icons/honoo_icon-48.png">

    <!-- Icone mobile -->
    <link rel="apple-touch-icon" href="icons/honoo_icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- (apple-mobile-web-app-capable è deprecato; lasciato non incluso per evitare warning) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="honoo">

    <title>honoo</title>

    <!-- Supporto HEIC su web (conversione client-side in PNG) -->
    <script src="https://unpkg.com/heic2any/dist/heic2any.min.js" async></script>
  </head>
  <body>
    <!-- Lo stesso sfondo resta visibile durante tutto il bootstrap di Flutter. -->
    <img
      id="landing-background"
      alt=""
      aria-hidden="true"
      decoding="sync"
      fetchpriority="high">
    <div id="landing-loader" role="status" aria-live="polite">
      <img
        id="landing-loader-icon"
        src="assets/assets/icons/load.svg"
        alt=""
        aria-hidden="true">
      <div id="landing-loader-progress">0%</div>
    </div>
    <script>
      const landingBackground = document.getElementById('landing-background');
      const landingLoader = document.getElementById('landing-loader');
      const landingProgress = document.getElementById(
        'landing-loader-progress',
      );
      let displayedProgress = 0;
      let targetProgress = 8;

      const setLandingProgress = (value, immediate = false) => {
        targetProgress = Math.max(
          targetProgress,
          Math.min(100, Math.round(value)),
        );
        if (immediate) {
          displayedProgress = targetProgress;
          landingProgress.textContent = `${displayedProgress}%`;
        }
      };

      const progressTimer = window.setInterval(() => {
        if (displayedProgress < targetProgress) {
          displayedProgress += Math.max(
            1,
            Math.ceil((targetProgress - displayedProgress) * 0.12),
          );
          displayedProgress = Math.min(displayedProgress, targetProgress);
          landingProgress.textContent = `${displayedProgress}%`;
        } else if (targetProgress < 92) {
          targetProgress += 1;
        }
      }, 45);

      landingBackground.addEventListener(
        'load',
        () => {
          landingBackground.classList.add('is-loaded');
          setLandingProgress(24);
        },
        { once: true },
      );
      landingBackground.src = window.honooLandingBackground;

      window.honooSetLandingProgress = setLandingProgress;
      window.addEventListener(
        'flutter-first-frame',
        () => {
          window.clearInterval(progressTimer);
          setLandingProgress(100, true);
          window.setTimeout(() => landingLoader.classList.add('is-complete'), 90);
          window.setTimeout(() => {
            landingBackground.remove();
            landingLoader.remove();
            delete window.honooSetLandingProgress;
          }, 280);
        },
        { once: true },
      );
    </script>
    <noscript>Per usare honoo è necessario abilitare JavaScript.</noscript>
    <script>
      // Temporary migration cleanup for clients that still have the legacy
      // Flutter service worker. Remove this block after old installations have
      // had enough time to receive the cleanup release.
      (() => {
        const reloadGuard = 'honoo.legacy_service_worker_cleanup_reloaded.v1';
        let flutterStarted = false;

        const startFlutter = () => {
          if (flutterStarted) return;
          flutterStarted = true;
          window.honooSetLandingProgress?.(36);

          const script = document.createElement('script');
          script.src = 'flutter_bootstrap.js';
          script.async = true;
          script.addEventListener(
            'load',
            () => window.honooSetLandingProgress?.(58),
            { once: true },
          );
          document.body.appendChild(script);
        };

        const cleanupLegacyFlutterWorker = async () => {
          let shouldReload = false;

          if ('serviceWorker' in navigator) {
            const registrations =
                await navigator.serviceWorker.getRegistrations();
            shouldReload = registrations.length > 0 ||
                navigator.serviceWorker.controller !== null;
            await Promise.allSettled(
              registrations.map((registration) => registration.unregister()),
            );
          }

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            shouldReload = shouldReload || cacheNames.length > 0;
            await Promise.allSettled(
              cacheNames.map((cacheName) => caches.delete(cacheName)),
            );
          }

          window.honooSetLandingProgress?.(30);

          if (shouldReload && sessionStorage.getItem(reloadGuard) !== 'true') {
            sessionStorage.setItem(reloadGuard, 'true');
            window.location.reload();
            return;
          }

          sessionStorage.removeItem(reloadGuard);
          startFlutter();
        };

        cleanupLegacyFlutterWorker().catch((error) => {
          console.warn('Legacy service worker cleanup failed.', error);
          startFlutter();
        });
      })();
    </script>
  </body>
</html>
