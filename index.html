<!DOCTYPE html>
<html lang="it">
  <head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apri gli occhi: c’è l’Isola davanti a te.">

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: #010e22;
      }

      #landing-background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
    </style>

    <script>
      (() => {
        const preferenceKey = 'flutter.public_landing_mobile_background';
        const desktopBackground = 'assets/assets/background.webp';
        const palombaroBackground =
          'assets/assets/background%2520palombaro.webp';
        const sirenaBackground =
          'assets/assets/background%2520sirena.webp';
        const isPhone = Math.min(window.innerWidth, window.innerHeight) < 600;
        let selectedBackground = desktopBackground;
        let selectedFlutterBackground = 'assets/background.webp';

        if (isPhone) {
          try {
            const previousBackground = JSON.parse(
              window.localStorage.getItem(preferenceKey),
            );
            selectedBackground =
              previousBackground === 'assets/background palombaro.webp'
                ? sirenaBackground
                : palombaroBackground;
            selectedFlutterBackground =
              selectedBackground === sirenaBackground
                ? 'assets/background sirena.webp'
                : 'assets/background palombaro.webp';
            window.localStorage.setItem(
              preferenceKey,
              JSON.stringify(selectedFlutterBackground),
            );
          } catch (_) {
            selectedBackground = palombaroBackground;
          }
        }

        window.honooLandingBackground = selectedBackground;

        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = selectedBackground;
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
      })();
    </script>

    <!-- Tema colore per Chrome, Android, ecc. -->
    <meta name="theme-color" content="#010e22">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon principale -->
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="icons/honoo_icon-48.png">

    <!-- Icone mobile -->
    <link rel="apple-touch-icon" href="icons/honoo_icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- (apple-mobile-web-app-capable è deprecato; lasciato non incluso per evitare warning) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="honoo">

    <title>honoo</title>

    <!-- Supporto HEIC su web (conversione client-side in PNG) -->
    <script src="https://unpkg.com/heic2any/dist/heic2any.min.js" async></script>
  </head>
  <body>
    <!-- Lo stesso sfondo resta visibile durante tutto il bootstrap di Flutter. -->
    <img
      id="landing-background"
      alt=""
      aria-hidden="true"
      decoding="sync"
      fetchpriority="high">
    <script>
      document.getElementById('landing-background').src =
        window.honooLandingBackground;
      window.addEventListener(
        'flutter-first-frame',
        () => document.getElementById('landing-background')?.remove(),
        { once: true },
      );
    </script>
    <noscript>Per usare honoo è necessario abilitare JavaScript.</noscript>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
