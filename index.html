<!DOCTYPE html>
<html lang="it">
  <head>
    <base href="/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apri gli occhi: c’è l’Isola davanti a te.">

    <!-- Tema colore per Chrome, Android, ecc. -->
    <meta name="theme-color" content="#0175C2">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon principale -->
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="icons/honoo_icon-48.png">

    <!-- Icone mobile -->
    <link rel="apple-touch-icon" href="icons/honoo_icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- (apple-mobile-web-app-capable è deprecato; lasciato non incluso per evitare warning) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="honoo">

    <title>honoo</title>

    <script>
      // The value below is injected by flutter build, do not touch.
      var serviceWorkerVersion = "2671415672";
    </script>

    <!-- Supporto HEIC su web (conversione client-side in PNG) -->
    <script src="https://unpkg.com/heic2any/dist/heic2any.min.js"></script>

    <script src="flutter.js" defer></script>
  </head>
  <body>
    <noscript>Per usare honoo è necessario abilitare JavaScript.</noscript>
    <!-- Service Worker DISABILITATO temporaneamente per evitare problemi di cache -->
    <script>
      window.addEventListener('load', function (ev) {
        _flutter.loader.loadEntrypoint({
          <!--
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          -->
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </body>
</html>
